name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reference-model tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Compile and run RTL testbenches
        run: |
          mkdir -p build
          for block in rgb_to_grayscale threshold_to_mask brightness_contrast pixel_stream_register_slice pixel_stream_line_metadata pixel_stream_frame_metadata three_line_buffer convolution_window_3x3 sobel_xy gradient_magnitude; do
            iverilog -g2012 -Wall \
              -o build/${block}.vvp \
              rtl/${block}.sv \
              tb/tb_${block}.sv
            vvp build/${block}.vvp
          done
