name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run reference-model tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Compile RTL testbench
        run: |
          mkdir -p build
          iverilog -g2012 -Wall \
            -o build/rgb_to_grayscale.vvp \
            rtl/rgb_to_grayscale.sv \
            tb/tb_rgb_to_grayscale.sv

      - name: Run RTL simulation
        run: vvp build/rgb_to_grayscale.vvp
